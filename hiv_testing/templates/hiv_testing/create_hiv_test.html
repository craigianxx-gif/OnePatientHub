{% extends 'base.html' %}

{% block title %}HIV Testing Module | OnePatient Hub{% endblock %}

{% block extra_css %}
<style>
    .form-wrapper {
        max-width: 680px;
        margin: 0 auto;
        padding-top: 12px;
    }

    .form-card {
        background: var(--surface-white);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        padding: 36px;
        box-shadow: var(--shadow-md);
    }

    /* Module Header Styling */
    .module-header {
        margin-bottom: 32px;
    }

    .module-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--coral-tint);
        color: var(--coral);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 16px;
    }

    .module-badge svg {
        width: 14px;
        height: 14px;
    }

    .module-header h1 {
        font-size: 1.85rem;
        margin-bottom: 6px;
    }

    .module-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    /* Target Django's default {{ form.as_p }} structure */
    .oph-form p {
        margin-bottom: 1.25rem;
        display: flex;
        flex-direction: column;
    }

    .oph-form label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 0.5rem;
    }

    /* Input Field Styling */
    .oph-form input[type="text"],
    .oph-form input[type="email"],
    .oph-form input[type="number"],
    .oph-form input[type="date"],
    .oph-form select,
    .oph-form textarea {
        width: 100%;
        background: var(--cream);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-sm);
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
        font-family: 'Manrope', sans-serif;
        color: var(--text-dark);
        transition: all 150ms ease;
    }

    .oph-form input:focus,
    .oph-form select:focus,
    .oph-form textarea:focus {
        background: var(--surface-white);
        border-color: var(--coral);
        box-shadow: 0 0 0 4px var(--coral-tint);
        outline: none;
    }

    /* Checkbox & Radio adjustments */
    .oph-form input[type="checkbox"],
    .oph-form input[type="radio"] {
        accent-color: var(--deep-teal);
        width: 16px;
        height: 16px;
        margin-right: 8px;
    }

    /* Action Buttons */
    .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light);
    }

    .btn-secondary {
        background: transparent;
        color: var(--text-dark);
        border: 1px solid var(--border-light);
        padding: 10px 20px;
        min-height: 44px;
        border-radius: var(--radius-sm);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 150ms ease;
    }

    .btn-secondary:hover {
        background: var(--cream);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card">
        
        <div class="module-header">
            <div class="module-badge">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
                Diagnostics
            </div>
            <h1>HIV Testing Module</h1>
            <p>Record and securely store clinical HIV test information.</p>
        </div>

        <form method="POST" class="oph-form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn-teal">
                    Submit HIV Test
                </button>
                <a href="{% url 'dashboard' %}" class="btn-secondary">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
