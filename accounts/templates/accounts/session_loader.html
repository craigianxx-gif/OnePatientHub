{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OnePatient Hub | Initializing</title>

    <meta name="theme-color" content="#16302C">

    <style>
        :root {
            --oph-teal: #16302C;
            --oph-teal-light: #24524B;
            --oph-coral: #E4633F;
            --oph-cream: #F7F4EF;
            --oph-white: #FFFFFF;
            --oph-text: #17302D;
            --oph-muted: #70817D;
            --oph-border: rgba(22, 48, 44, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(228, 99, 63, 0.08),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(22, 48, 44, 0.12),
                    transparent 30%
                ),
                var(--oph-cream);

            color: var(--oph-text);
        }

        /* =========================================
           PAGE
        ========================================= */

        .loader-page {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            isolation: isolate;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .background-grid {
            position: absolute;
            inset: 0;

            opacity: 0.28;

            background-image:
                linear-gradient(
                    rgba(22, 48, 44, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(22, 48, 44, 0.035) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 20%,
                    black 80%,
                    transparent
                );

            pointer-events: none;
        }

        .orb {
            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(10px);

            z-index: -1;
        }

        .orb-one {
            width: 420px;
            height: 420px;

            top: -230px;
            left: -160px;

            background:
                radial-gradient(
                    circle,
                    rgba(228, 99, 63, 0.14),
                    transparent 68%
                );

            animation: orbFloatOne 9s ease-in-out infinite;
        }

        .orb-two {
            width: 480px;
            height: 480px;

            right: -210px;
            bottom: -260px;

            background:
                radial-gradient(
                    circle,
                    rgba(22, 48, 44, 0.15),
                    transparent 68%
                );

            animation: orbFloatTwo 11s ease-in-out infinite;
        }

        /* =========================================
           MAIN CONTENT
        ========================================= */

        .loader-content {
            width: min(480px, calc(100vw - 40px));

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            animation: contentEnter 700ms cubic-bezier(.22, 1, .36, 1);
        }

        /* =========================================
           BRAND
        ========================================= */

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            padding: 9px 15px 9px 9px;

            border: 1px solid var(--oph-border);

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.68);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 16px 45px rgba(22, 48, 44, 0.08);
        }

        .brand-mark {
            position: relative;

            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    var(--oph-teal),
                    var(--oph-teal-light)
                );

            color: white;

            box-shadow:
                0 8px 22px rgba(22, 48, 44, 0.20);
        }

        .brand-mark::after {
            content: "";

            position: absolute;
            inset: 5px;

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 8px;
        }

        .brand-mark svg {
            position: relative;
            z-index: 2;
        }

        .brand-copy {
            text-align: left;
        }

        .brand-name {
            font-size: 0.96rem;
            font-weight: 800;

            letter-spacing: -0.3px;

            color: var(--oph-teal);
        }

        .brand-subtitle {
            margin-top: 2px;

            font-size: 0.55rem;
            font-weight: 800;

            letter-spacing: 1.65px;

            color: var(--oph-muted);
        }

        /* =========================================
           OPH IDENTITY
        ========================================= */

        .identity {
            position: relative;

            width: 156px;
            height: 156px;

            margin-top: 44px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .identity-ring {
            position: absolute;
            inset: 0;

            border-radius: 50%;

            border: 2px solid rgba(22, 48, 44, 0.08);

            border-top-color: var(--oph-teal);
            border-right-color: rgba(228, 99, 63, 0.55);

            animation:
                ringSpin 1.8s linear infinite;
        }

        .identity-ring-two {
            position: absolute;

            inset: 14px;

            border-radius: 50%;

            border: 1px dashed rgba(22, 48, 44, 0.20);

            animation:
                ringSpinReverse 5s linear infinite;
        }

        .identity-ring-three {
            position: absolute;

            inset: 29px;

            border-radius: 50%;

            border: 1px solid rgba(228, 99, 63, 0.16);

            animation:
                ringPulse 2.4s ease-in-out infinite;
        }

        .identity-core {
            position: relative;

            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    var(--oph-teal),
                    #214B45
                );

            color: white;

            box-shadow:
                0 0 0 8px rgba(22, 48, 44, 0.035),
                0 18px 45px rgba(22, 48, 44, 0.25);

            animation: coreFloat 2.6s ease-in-out infinite;
        }

        .identity-core::before {
            content: "";

            position: absolute;
            inset: 6px;

            border-radius: 17px;

            border: 1px solid rgba(255,255,255,0.20);
        }

        .identity-core svg {
            position: relative;
            z-index: 2;
        }

        .pulse-dot {
            position: absolute;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--oph-coral);

            box-shadow:
                0 0 0 5px rgba(228, 99, 63, 0.12),
                0 0 18px rgba(228, 99, 63, 0.35);

            animation: pulseDot 1.7s ease-in-out infinite;
        }

        .pulse-dot.one {
            top: 25px;
            right: 23px;
        }

        .pulse-dot.two {
            bottom: 25px;
            left: 23px;

            animation-delay: 700ms;
        }

        /* =========================================
           STATUS
        ========================================= */

        .status {
            margin-top: 30px;
        }

        .secure-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            color: var(--oph-teal);

            font-size: 0.67rem;
            font-weight: 800;

            letter-spacing: 1.6px;
        }

        .secure-indicator {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #3C8C62;

            box-shadow:
                0 0 0 4px rgba(60, 140, 98, 0.10);

            animation: statusPulse 1.8s ease-in-out infinite;
        }

        .headline {
            margin-top: 10px;

            color: var(--oph-teal);

            font-size: clamp(1.25rem, 4vw, 1.55rem);

            font-weight: 800;

            letter-spacing: -0.7px;
        }

        .message {
            margin-top: 8px;

            color: var(--oph-muted);

            font-size: 0.84rem;

            line-height: 1.6;

            font-weight: 500;
        }

        /* =========================================
           PROGRESS
        ========================================= */

        .progress-wrapper {
            width: min(300px, 100%);

            margin-top: 27px;
        }

        .progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 9px;

            font-size: 0.62rem;

            color: var(--oph-muted);

            font-weight: 700;
        }

        .progress-track {
            position: relative;

            width: 100%;
            height: 5px;

            overflow: hidden;

            border-radius: 999px;

            background: rgba(22, 48, 44, 0.09);
        }

        .progress-bar {
            height: 100%;

            width: 8%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    var(--oph-teal),
                    var(--oph-coral)
                );

            box-shadow:
                0 0 14px rgba(22, 48, 44, 0.20);

            transition:
                width 500ms cubic-bezier(.22, 1, .36, 1);
        }

        /* =========================================
           BOTTOM STATUS
        ========================================= */

        .system-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-top: 23px;

            color: var(--oph-muted);

            font-size: 0.65rem;

            font-weight: 600;
        }

        .system-status svg {
            color: var(--oph-teal);
        }

        .platform-label {
            display: flex;
            align-items: center;
            gap: 7px;

            margin-top: 34px;

            color: rgba(112, 129, 125, 0.75);

            font-size: 0.61rem;

            font-weight: 600;

            letter-spacing: 0.2px;
        }

        .platform-label span {
            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: var(--oph-coral);
        }

        /* =========================================
           ANIMATIONS
        ========================================= */

        @keyframes ringSpin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes ringSpinReverse {
            from {
                transform: rotate(360deg);
            }

            to {
                transform: rotate(0deg);
            }
        }

        @keyframes ringPulse {
            0%,
            100% {
                transform: scale(0.96);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }

        @keyframes coreFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes pulseDot {
            0%,
            100% {
                transform: scale(0.75);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        @keyframes statusPulse {
            0%,
            100% {
                opacity: 0.45;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes contentEnter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes orbFloatOne {
            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(30px, 25px);
            }
        }

        @keyframes orbFloatTwo {
            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25px, -20px);
            }
        }

        /* =========================================
           REDUCED MOTION
        ========================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 520px) {
            .loader-content {
                width: calc(100vw - 32px);
            }

            .identity {
                width: 138px;
                height: 138px;

                margin-top: 36px;
            }

            .identity-core {
                width: 66px;
                height: 66px;
            }

            .headline {
                font-size: 1.25rem;
            }

            .message {
                font-size: 0.79rem;
            }

            .platform-label {
                margin-top: 27px;
            }
        }
    </style>
</head>

<body>

<div class="loader-page">

    <div class="background-grid"></div>

    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>

    <main class="loader-content">

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-mark">

                <svg
                    width="21"
                    height="21"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="12" r="8"></circle>
                    <path d="M12 8v8"></path>
                    <path d="M8 12h8"></path>
                </svg>

            </div>

            <div class="brand-copy">

                <div class="brand-name">
                    OnePatient Hub
                </div>

                <div class="brand-subtitle">
                    PATIENT IDENTITY &amp; CARE COORDINATION
                </div>

            </div>

        </div>


        <!-- OPH IDENTITY -->

        <div class="identity">

            <div class="identity-ring"></div>

            <div class="identity-ring-two"></div>

            <div class="identity-ring-three"></div>

            <div class="pulse-dot one"></div>
            <div class="pulse-dot two"></div>

            <div class="identity-core">

                <svg
                    width="31"
                    height="31"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <circle cx="12" cy="8" r="3"></circle>

                    <path
                        d="M5.5 20c.7-3.4 3-5 6.5-5s5.8 1.6 6.5 5"
                    ></path>

                    <path d="M19 7v4"></path>
                    <path d="M17 9h4"></path>
                </svg>

            </div>

        </div>


        <!-- STATUS -->

        <section class="status">

            <div class="secure-label">

                <span class="secure-indicator"></span>

                SECURE SESSION

            </div>

            <div class="headline">
                Preparing your workspace
            </div>

            <div class="message" id="loader-message">
                Establishing your OnePatient Hub environment...
            </div>

        </section>


        <!-- PROGRESS -->

        <div class="progress-wrapper">

            <div class="progress-meta">

                <span id="progress-label">
                    Initializing
                </span>

                <span id="progress-value">
                    8%
                </span>

            </div>

            <div class="progress-track">

                <div
                    class="progress-bar"
                    id="progress-bar"
                ></div>

            </div>

        </div>


        <!-- SYSTEM STATUS -->

        <div class="system-status">

            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>

            Establishing secure application session

        </div>


        <!-- PLATFORM -->

        <div class="platform-label">

            <span></span>

            Connected patient coordination platform

        </div>

    </main>

</div>


<script>

    const progressBar =
        document.getElementById("progress-bar");

    const progressValue =
        document.getElementById("progress-value");

    const progressLabel =
        document.getElementById("progress-label");

    const loaderMessage =
        document.getElementById("loader-message");


    const stages = [
        {
            progress: 8,
            label: "Initializing",
            message:
                "Establishing your OnePatient Hub environment..."
        },

        {
            progress: 28,
            label: "Preparing",
            message:
                "Preparing your secure workspace..."
        },

        {
            progress: 52,
            label: "Loading",
            message:
                "Loading your patient coordination workspace..."
        },

        {
            progress: 72,
            label: "Synchronizing",
            message:
                "Preparing patient and facility services..."
        },

        {
            progress: 88,
            label: "Finalizing",
            message:
                "Finalizing your OnePatient Hub session..."
        },

        {
            progress: 96,
            label: "Ready",
            message:
                "Your workspace is ready."
        }
    ];


    let stageIndex = 0;


    function updateStage(stage) {

        progressBar.style.width =
            `${stage.progress}%`;

        progressValue.textContent =
            `${stage.progress}%`;

        progressLabel.textContent =
            stage.label;

        loaderMessage.textContent =
            stage.message;
    }


    updateStage(stages[0]);


    const stageTimer = setInterval(() => {

        stageIndex++;

        if (stageIndex >= stages.length) {

            clearInterval(stageTimer);

            progressBar.style.width = "100%";
            progressValue.textContent = "100%";
            progressLabel.textContent = "Ready";

            loaderMessage.textContent =
                "Welcome to OnePatient Hub.";

            setTimeout(() => {

                window.location.href =
                    "{% url 'dashboard' %}";

            }, 450);

            return;
        }

        updateStage(stages[stageIndex]);

    }, 620);

</script>

</body>
</html>
