{% extends 'base.html' %}

{% block title %}Create Patient Referral | OnePatient Hub{% endblock %}

{% block extra_css %}
<style>
    .form-wrapper {
        max-width: 650px;
        margin: 0 auto;
        padding-top: 12px;
    }

    .form-card { 
        background: var(--surface-white);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        padding: 40px;
        box-shadow: var(--shadow-md);
    }

    .page-header {
        margin-bottom: 32px;
    }

    .page-header h1 {
        font-size: 1.85rem;
        color: var(--deep-teal);
        margin-bottom: 6px;
    }

    .page-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    /* Django Form Styling */
    .django-form-wrapper p { margin-bottom: 1.5rem; }
    
    .django-form-wrapper p > label { 
        font-weight: 700; 
        font-size: 0.85rem; 
        margin-bottom: 0.5rem; 
        display: block; 
        color: var(--text-dark); 
    }
    
    .django-form-wrapper p > input, 
    .django-form-wrapper p > select, 
    .django-form-wrapper p > textarea { 
        display: block; 
        width: 100%; 
        padding: 0.8rem 1rem; 
        font-size: 0.95rem; 
        font-family: 'Manrope', sans-serif;
        color: var(--text-dark); 
        background-color: var(--cream); 
        border: 1px solid var(--border-light); 
        border-radius: var(--radius-sm); 
        transition: all 150ms ease; 
    }
    
    .django-form-wrapper p > input:focus, 
    .django-form-wrapper p > select:focus,
    .django-form-wrapper p > textarea:focus { 
        border-color: var(--coral); 
        background-color: var(--surface-white); 
        outline: none; 
        box-shadow: 0 0 0 4px var(--coral-tint); 
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border-light);
    }

    .btn-secondary {
        background: transparent;
        color: var(--text-dark);
        border: 1px solid var(--border-light);
        padding: 10px 20px;
        min-height: 44px;
        border-radius: var(--radius-sm);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 150ms ease;
    }

    .btn-secondary:hover {
        background: var(--cream);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="page-header">
        <h1>Create Patient Referral</h1>
        <p>Transfer a patient to another facility for specialized care.</p>
    </div>

    <div class="form-card">
        <form method="POST" class="django-form-wrapper">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div class="form-actions">
                <button type="submit" class="btn-teal">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    Create Referral
                </button>
                <a href="{% url 'dashboard' %}" class="btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
