<!DOCTYPE html>
<html lang="en">
<head>
    <title>Delete Patient | OnePatient Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
        .card-modern { border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border-top: 4px solid #ef4444; }
        .btn-modern { border-radius: 8px; font-weight: 500; padding: 0.6rem 1.2rem; }
        .icon-danger { width: 64px; height: 64px; color: #ef4444; background: #fef2f2; border-radius: 50%; padding: 12px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
<div class="container mt-5 d-flex justify-content-center">
    <div class="card card-modern" style="max-width: 450px; width: 100%;">
        <div class="card-body text-center p-4 p-md-5">
            <div class="icon-danger">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h4 class="fw-bold mb-3">Delete Patient Record?</h4>
            <p class="text-muted mb-4">
                Are you absolutely sure you want to delete 
                <strong class="text-dark">{{ patient.first_name }} {{ patient.last_name }}</strong>? 
                This action cannot be undone.
            </p>
            <form method="POST" class="d-flex gap-2 justify-content-center">
                {% csrf_token %}
                <a href="{% url 'patient_profile' patient.id %}" class="btn btn-light btn-modern text-secondary border">Cancel</a>
                <button type="submit" class="btn btn-danger btn-modern">Yes, Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
