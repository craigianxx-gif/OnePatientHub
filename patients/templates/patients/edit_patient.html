<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Patient | OnePatient Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
        .card-modern { border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); background: #fff; }
        .btn-modern { border-radius: 8px; font-weight: 500; padding: 0.6rem 1.2rem; }
        /* Style Django's default {{ form.as_p }} output */
        .django-form-wrapper p { margin-bottom: 1.25rem; }
        .django-form-wrapper p > label { font-weight: 500; font-size: 0.875rem; margin-bottom: 0.4rem; display: block; color: #334155; }
        .django-form-wrapper p > input, .django-form-wrapper p > select, .django-form-wrapper p > textarea { display: block; width: 100%; padding: 0.6rem 0.8rem; font-size: 0.95rem; color: #1e293b; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; transition: all 0.2s; }
        .django-form-wrapper p > input:focus, .django-form-wrapper p > select:focus { border-color: #3b82f6; background-color: #fff; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0">Edit Profile</h3>
        <a href="{% url 'patient_profile' patient.id %}" class="btn btn-light btn-modern border text-secondary">Back</a>
    </div>

    <div class="card card-modern">
        <div class="card-body p-4 p-md-5">
            <form method="POST" class="django-form-wrapper">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2 mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary btn-modern">Save Changes</button>
                    <a href="{% url 'patient_profile' patient.id %}" class="btn btn-light btn-modern border text-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
