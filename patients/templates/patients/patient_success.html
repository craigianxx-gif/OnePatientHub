<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patient Registered | OnePatient Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; }
        .card-modern { border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .btn-modern { border-radius: 8px; font-weight: 500; padding: 0.6rem 1.2rem; }
        .icon-success { width: 64px; height: 64px; color: #10b981; background: #d1fae5; border-radius: 50%; padding: 12px; margin: 0 auto 1.5rem auto; display: flex; align-items: center; justify-content: center; }
        .id-badge { background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 1rem; font-size: 1.25rem; font-weight: 700; color: #3b82f6; letter-spacing: 1px; }
    </style>
</head>
<body>
<div class="container mt-5 d-flex justify-content-center">
    <div class="card card-modern text-center" style="max-width: 500px; width: 100%;">
        <div class="card-body p-4 p-md-5">
            
            <div class="icon-success">
                <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
            </div>
            
            <h3 class="fw-bold mb-2">Registration Complete</h3>
            <p class="text-muted mb-4">
                <strong>{{ patient.first_name }} {{ patient.last_name }}</strong> has been successfully added to the system.
            </p>

            <div class="id-badge mb-4">
                <span class="d-block text-muted" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0;">OPH-ID</span>
                {{ patient.oph_id }}
            </div>

            <!-- Action Buttons -->
            <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
                <a href="{% url 'patient_records' %}" class="btn btn-light btn-modern border text-secondary w-100">
                    Back to Records
                </a>
                <a href="{% url 'register_patient' %}" class="btn btn-primary btn-modern w-100">
                    Register Another
                </a>
            </div>
            
            <!-- Quick Link to Profile -->
            <a href="{% url 'patient_profile' patient.id %}" class="text-decoration-none fw-medium text-primary" style="font-size: 0.9rem;">
                View Patient Profile &rarr;
            </a>

        </div>
    </div>
</div>
</body>
</html>
